services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: secure-prompt-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./rules:/app/rules
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: secure-prompt-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://127.0.0.1:8000
    depends_on:
      - backend
    restart: unless-stopped